<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}estante{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  {% if usuario %}
  <header class="topo">
    <a class="logo" href="{{ url_for('inicio') }}">e<b>s</b>tante</a>
    <nav>
      <a href="{{ url_for('inicio') }}" class="{{ 'ativo' if request.endpoint == 'inicio' }}">Início</a>
      <a href="{{ url_for('buscar') }}" class="{{ 'ativo' if request.endpoint == 'buscar' }}">Buscar</a>
      <a href="{{ url_for('estante') }}" class="{{ 'ativo' if request.endpoint == 'estante' }}">Estante</a>
    </nav>
    <a class="perfil" href="{{ url_for('sair') }}" title="Sair"><span class="avatar">{{ usuario.nome[0] }}</span> {{ usuario.nome }}</a>
  </header>
  {% endif %}
  <main>
    {% for mensagem in get_flashed_messages() %}<p class="aviso">{{ mensagem }}</p>{% endfor %}
    {% block conteudo %}{% endblock %}
  </main>
</body>
</html>
