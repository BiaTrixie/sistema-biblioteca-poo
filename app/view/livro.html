{% extends "base.html" %}
{% block conteudo %}
<div class="pagina-livro" id="pagina" data-livro="{{ id_livro }}"></div>
{% endblock %}
{% block script %}
<script>
exigirLogin();
montarTopo();
const id = Number(document.getElementById("pagina").dataset.livro);

function dataCurta(iso) {
  const [ano, mes, dia] = iso.slice(0, 10).split("-");
  return `${dia}/${mes}/${ano}`;
}

async function mudar(status) {
  await api("/estante/" + id, { method: "PATCH", json: { status } });
  await carregar();
}

async function comentar(evento) {
  evento.preventDefault();
  const texto = new FormData(evento.target).get("texto");
  try {
    await api(`/livros/${id}/comentarios`, { method: "POST", json: { texto } });
    await carregar();
  } catch (erro) {
    aviso(erro.message);
  }
}

async function curtir(idComentario) {
  await api("/comentarios/" + idComentario, { method: "PATCH" });
  await carregar();
}

async function carregar() {
  const [item, avaliacoes, comentarios, estante] = await Promise.all([
    api("/livros/" + id),
    api("/livros/" + id + "/avaliacoes"),
    api("/livros/" + id + "/comentarios"),
    api("/estante"),
  ]);
  if (!item) return;
  document.title = item.nome + " — estante";
  const registro = estante.find((linha) => linha.livro_id === id);
  const meu = comentarios.find((linha) => linha.usuario_id === usuarioLocal().id);
  const media = item.media == null ? "—" : item.media.toFixed(1).replace(".", ",");
  document.getElementById("pagina").innerHTML = `
    ${htmlCapa(item)}
    <section>
      <p class="etiquetas"><span>${esc(item.genero)}</span><span>${esc(item.edicao)} edição</span><span>${esc(item.editora)}</span></p>
      <h1>${esc(item.nome)}</h1>
      <p class="autora">${esc(item.autora)}</p>
      <p class="mudo">${item.ano} · Editora ${esc(item.editora)}${registro && registro.lido ? " · lido" : ""}</p>
      <p>${esc(item.sinopse)}</p>
      <div class="acoes">
        <button class="botao ${registro && registro.lido ? "verde" : ""}" data-status="lido">Lido</button>
        <button class="botao ${registro && registro.favorito ? "laranja" : ""}" data-status="favorito">Favorito</button>
        <button class="botao ${registro && registro.quer_ler ? "laranja" : ""}" data-status="quer_ler">Quero ler</button>
        <a class="botao" href="/livro/${id}/avaliar">Avaliar</a>
      </div>
      <p class="mudo pequeno">Lido e Quero ler não ficam marcados juntos: marcar um desmarca o outro.</p>
      <p class="media"><b>${media}</b> ${estrelas(item.media)}
        <span class="mudo">${avaliacoes.length} ${avaliacoes.length === 1 ? "avaliação" : "avaliações"}</span></p>
      <h3 class="rotulo">Comentários</h3>
      ${comentarios.map((c) => `<div class="comentario">
        <strong>${esc(c.usuario)} · ${dataCurta(c.data)} · ${c.curtidas} curtidas</strong>
        <p>${esc(c.texto)}</p>
        <button class="link ${c.eu_curti ? "curtido" : ""}" data-curtir="${c.id}">${c.eu_curti ? "Curtido" : "Curtir"}</button>
      </div>`).join("")}
      ${avaliacoes.map((a) => `<div class="comentario">
        <strong>${esc(a.usuario)} · avaliação · nota ${a.nota}</strong>
        ${a.comentario ? `<p>${esc(a.comentario)}</p>` : ""}
      </div>`).join("")}
      <form class="novo-comentario" id="comentario">
        <textarea name="texto" rows="2" placeholder="Escreva um comentário">${meu ? esc(meu.texto) : ""}</textarea>
        <button class="botao">${meu ? "Atualizar comentário" : "Comentar"}</button>
      </form>
      <p class="mudo pequeno">Um comentário por livro: comentar de novo substitui o anterior.</p>
    </section>`;
  document.querySelectorAll("[data-status]").forEach((botao) => {
    botao.addEventListener("click", () => mudar(botao.dataset.status).catch((erro) => aviso(erro.message)));
  });
  document.querySelectorAll("[data-curtir]").forEach((botao) => {
    botao.addEventListener("click", () => curtir(botao.dataset.curtir).catch((erro) => aviso(erro.message)));
  });
  document.getElementById("comentario").addEventListener("submit", comentar);
}

carregar().catch((erro) => aviso(erro.message));
</script>
{% endblock %}
